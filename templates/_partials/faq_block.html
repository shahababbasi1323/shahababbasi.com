<section id="faq" class="section-padding scroll-mt-20">
  <div class="container-tight max-w-3xl">
    <p class="text-xs uppercase tracking-widest text-accent text-center mb-3">FAQ</p>
    <h2 class="font-display text-3xl md:text-4xl font-bold tracking-tight text-center">Frequently asked questions</h2>
    <p class="mt-3 text-center text-foreground/70">{{ faq.intro|default('Quick answers to the questions buyers ask most. Need something specific? Book a call.') }}</p>
    <div class="mt-10 space-y-3">
      {% for q in faq.questions %}
      <details class="glass rounded-xl p-5">
        <summary class="flex items-center justify-between gap-4 font-medium">
          <span>{{ q.question }}</span>
          <svg class="icon-rotate w-5 h-5 text-accent" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.06l3.71-3.83a.75.75 0 111.08 1.04l-4.24 4.39a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg>
        </summary>
        <div class="mt-3 text-sm text-foreground/80 leading-relaxed">{{ q.answer|safe }}</div>
      </details>
      {% endfor %}
    </div>
  </div>
</section>
